# Tiny synthetic shower run (CPU): exercises the shower layout (layers as depth, periodic angle, E_inc condition).
dataset: smoke_calo
run_name: smoke
device: cpu
num_workers: 0
data:
  kind: shower
  source: synthetic
  planes: 6
  hr_shape: [16, 9]
  circular_u: true
  r_edges: [0.0, 4.65, 9.3, 13.95, 18.6, 27.9, 37.2, 46.5, 55.8, 65.1]
  layer_groups: [[0, 2], [2, 4], [4, 6]]
  hit_threshold: 0.0151
  max_events: 160
ladder:
  lr_factor: [4, 3]
  stages: [[2, 3], [2, 1]]       # 4x3 -> 8x9 -> 16x9
noise:
  rel_sigma: 0.1
model: {patch: [2, 4, 3]}
encoder: {dim: 48, depth: 2, heads: 2}
predictor: {dim: 32, depth: 1, heads: 2}
masks:
  - {n_blocks: 4, spatial_scale: [0.15, 0.15], aspect: [0.75, 1.5], depth_scale: [0.3, 0.6]}
  - {n_blocks: 1, spatial_scale: [0.7, 0.7], aspect: [0.75, 1.5], depth_scale: [1.0, 1.0]}
pretrain: {batch_size: 16, epochs: 2}
sr: {dim: 48, depth: 2, heads: 2, batch_size: 16, epochs: 2}
decoder: {dim: 32, depth: 1, heads: 2, batch_size: 16, epochs: 2}
e2e: {batch_size: 16, epochs: 1}
probe: {heads: 2, batch_size: 16, epochs: 2}
eval: {max_events: 32, batch_size: 16, n_examples: 2, ecf_top_k: 8}
